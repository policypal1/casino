<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kumpula Casino</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== RESET ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; }
body {
  font-family: 'Inter', sans-serif;
  background: #08060f;
  color: #fff;
  min-height: 100vh;
  position: relative;
  overflow-y: auto;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ===== ANIMATED BACKGROUND ===== */
.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(120, 50, 255, 0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120, 50, 255, 0.07) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: gridMove 20s linear infinite;
}
@keyframes gridMove { 0% { transform: translate(0,0);} 100% { transform: translate(40px,40px);} }
.bg-glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.45; z-index: 0; pointer-events: none; }
.glow-1 { width: 500px; height: 500px; background: #ff00aa; top: -100px; left: -100px; animation: float1 15s ease-in-out infinite; }
.glow-2 { width: 600px; height: 600px; background: #00d4ff; bottom: -200px; right: -100px; animation: float2 18s ease-in-out infinite; }
.glow-3 { width: 400px; height: 400px; background: #ffaa00; top: 40%; left: 50%; animation: float3 12s ease-in-out infinite; }
@keyframes float1 { 0%,100% { transform: translate(0,0);} 50% { transform: translate(100px,80px);} }
@keyframes float2 { 0%,100% { transform: translate(0,0);} 50% { transform: translate(-80px,-100px);} }
@keyframes float3 { 0%,100% { transform: translate(-50%,0);} 50% { transform: translate(-50%,-60px);} }

#particles { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* Screen shake wrapper */
.shake-wrapper { animation: none; }
.shake-wrapper.shake-sm { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
.shake-wrapper.shake-md { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
.shake-wrapper.shake-lg { animation: shakeBig 0.7s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
  10%,90% { transform: translate(-1px, 0); }
  20%,80% { transform: translate(2px, 0); }
  30%,50%,70% { transform: translate(-4px, 0); }
  40%,60% { transform: translate(4px, 0); }
}
@keyframes shakeBig {
  10%,90% { transform: translate(-3px, -2px); }
  20%,80% { transform: translate(5px, 3px); }
  30%,50%,70% { transform: translate(-8px, -3px); }
  40%,60% { transform: translate(8px, 2px); }
}

/* ===== TOP BAR ===== */
.topbar {
  position: relative; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 28px;
  background: rgba(15, 10, 30, 0.6);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255, 0, 170, 0.2);
}
.logo { display: flex; align-items: center; gap: 12px; font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 2px; }
.logo-icon { font-size: 36px; filter: drop-shadow(0 0 12px #ffaa00); animation: logoSpin 6s ease-in-out infinite; }
@keyframes logoSpin { 0%,100% { transform: rotate(-5deg);} 50% { transform: rotate(5deg);} }
.logo-accent { background: linear-gradient(90deg, #ff00aa, #ffaa00); -webkit-background-clip: text; background-clip: text; color: transparent; margin-left: 6px; }
.topbar-right { display: flex; gap: 14px; align-items: center; }
.balance-display {
  display: flex; flex-direction: column; align-items: flex-end;
  padding: 8px 20px;
  background: linear-gradient(135deg, rgba(255, 170, 0, 0.15), rgba(255, 0, 170, 0.15));
  border: 1px solid rgba(255, 170, 0, 0.4);
  border-radius: 10px;
  position: relative; overflow: hidden;
}
.balance-display.flash-up { animation: balanceUp 0.6s ease; }
.balance-display.flash-down { animation: balanceDown 0.4s ease; }
@keyframes balanceUp {
  0% { background: linear-gradient(135deg, rgba(255, 170, 0, 0.15), rgba(255, 0, 170, 0.15)); }
  50% { background: linear-gradient(135deg, rgba(0, 255, 150, 0.5), rgba(0, 200, 100, 0.5)); transform: scale(1.05); }
  100% { background: linear-gradient(135deg, rgba(255, 170, 0, 0.15), rgba(255, 0, 170, 0.15)); }
}
@keyframes balanceDown {
  0%,100% { background: linear-gradient(135deg, rgba(255, 170, 0, 0.15), rgba(255, 0, 170, 0.15)); }
  50% { background: linear-gradient(135deg, rgba(255, 50, 50, 0.3), rgba(200, 30, 30, 0.3)); }
}
.balance-label { font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.6); font-weight: 600; }
.balance-amount { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #ffd700; text-shadow: 0 0 12px rgba(255, 215, 0, 0.6); letter-spacing: 1px; font-variant-numeric: tabular-nums; }
.admin-toggle {
  padding: 10px 18px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2); color: #fff;
  border-radius: 10px; font-size: 12px; font-weight: 600; letter-spacing: 1.5px;
  cursor: pointer; transition: all 0.2s;
}
.admin-toggle:hover { background: rgba(255, 0, 170, 0.2); border-color: #ff00aa; }
.sound-toggle {
  padding: 10px 14px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2); color: #fff;
  border-radius: 10px; font-size: 16px; cursor: pointer; transition: all 0.2s;
}
.sound-toggle:hover { background: rgba(0, 212, 255, 0.2); border-color: #00d4ff; }

/* ===== USER BAR ===== */
.user-bar { position: relative; z-index: 5; display: flex; gap: 10px; padding: 14px 28px; overflow-x: auto; }

/* ===== GAME TABS ===== */
.game-tabs {
  position: relative; z-index: 5;
  display: flex; gap: 10px; padding: 14px 28px 0;
  max-width: 1400px; margin: 0 auto;
  overflow-x: auto;
}
.game-tab {
  flex: 0 0 auto;
  padding: 12px 28px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.6);
  border-radius: 12px 12px 0 0;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  border-bottom: none;
}
.game-tab:hover { background: rgba(255,255,255,0.08); color: #fff; }
.game-tab.active {
  background: linear-gradient(180deg, rgba(255, 0, 170, 0.25), rgba(255, 0, 170, 0.08));
  border-color: #ff00aa;
  color: #fff;
  box-shadow: 0 -4px 20px rgba(255, 0, 170, 0.3);
}
.game-tab.active::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, #ff00aa, transparent);
}

/* ===== MINES GAME ===== */
.mines-section { display: flex; justify-content: center; }
.mines-machine {
  width: 100%; max-width: 560px;
  background: linear-gradient(180deg, #1a0d2e 0%, #0d0820 100%);
  border: 2px solid rgba(0, 212, 255, 0.3);
  border-radius: 20px; padding: 22px;
  box-shadow: 0 0 40px rgba(0, 212, 255, 0.2), inset 0 0 40px rgba(0,0,0,0.5);
  position: relative;
}
.mines-machine::before {
  content: ''; position: absolute; inset: -2px;
  border-radius: 20px; padding: 2px;
  background: linear-gradient(135deg, #00d4ff, #00ff96, #ffd700, #00d4ff);
  background-size: 300% 300%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: borderShift 4s linear infinite; pointer-events: none;
}

.mines-header {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.mines-stat {
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}
.mines-stat.mult-display {
  background: linear-gradient(135deg, rgba(0, 255, 150, 0.15), rgba(255, 215, 0, 0.15));
  border-color: rgba(0, 255, 150, 0.4);
}
.mines-stat.cashout-display {
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 100, 0, 0.15));
  border-color: rgba(255, 215, 0, 0.4);
}
.mines-stat-label {
  font-size: 10px; letter-spacing: 1.5px;
  color: rgba(255,255,255,0.6); font-weight: 600;
}
.mines-stat-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px; letter-spacing: 1px;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.mult-display .mines-stat-value { color: #00ff96; text-shadow: 0 0 10px rgba(0, 255, 150, 0.5); }
.cashout-display .mines-stat-value { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
.mult-display.bump .mines-stat-value { animation: multBump 0.4s ease; }
@keyframes multBump { 0% { transform: scale(1);} 50% { transform: scale(1.25);} 100% { transform: scale(1);} }

.mines-grid {
  display: grid;
  gap: 8px;
  padding: 12px;
  background: #000;
  border-radius: 12px;
  border: 2px solid rgba(0, 212, 255, 0.4);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  margin-bottom: 14px;
}
.mine-tile {
  aspect-ratio: 1;
  background: linear-gradient(135deg, #2a1a4a 0%, #1a0d2e 100%);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(20px, 6vw, 36px);
  transition: all 0.15s;
  position: relative;
  overflow: hidden;
  user-select: none;
}
.mine-tile:not(.revealed):hover {
  background: linear-gradient(135deg, #3a2a5a 0%, #2a1d3e 100%);
  border-color: rgba(0, 212, 255, 0.4);
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
}
.mine-tile:not(.revealed):active { transform: scale(0.95); }
.mine-tile.disabled { cursor: not-allowed; opacity: 0.5; }
.mine-tile.disabled:hover { transform: none; background: linear-gradient(135deg, #2a1a4a 0%, #1a0d2e 100%); border-color: rgba(255,255,255,0.1); box-shadow: none; }

.mine-tile.revealed.safe {
  background: linear-gradient(135deg, rgba(0, 255, 150, 0.25), rgba(0, 200, 100, 0.15));
  border-color: rgba(0, 255, 150, 0.5);
  animation: safeReveal 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 15px rgba(0, 255, 150, 0.3);
}
@keyframes safeReveal {
  0% { transform: scale(0.5) rotateY(180deg); opacity: 0;}
  60% { transform: scale(1.15) rotateY(0);}
  100% { transform: scale(1) rotateY(0); opacity: 1;}
}

.mine-tile.revealed.mine {
  background: linear-gradient(135deg, rgba(255, 50, 50, 0.4), rgba(200, 30, 30, 0.3));
  border-color: rgba(255, 100, 100, 0.7);
  animation: mineBoom 0.6s ease;
  box-shadow: 0 0 30px rgba(255, 50, 50, 0.6);
}
@keyframes mineBoom {
  0% { transform: scale(1);}
  20% { transform: scale(1.4); background: radial-gradient(circle, #fff, #ff0000);}
  40% { transform: scale(1.15);}
  60% { transform: scale(1.3);}
  100% { transform: scale(1);}
}

.mine-tile.revealed.mine-shown {
  background: linear-gradient(135deg, rgba(80, 30, 30, 0.4), rgba(60, 20, 20, 0.3));
  border-color: rgba(255, 100, 100, 0.3);
  opacity: 0.7;
}

.mines-controls-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.mines-input-group {
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px;
}
.mines-input-label {
  font-size: 10px; letter-spacing: 1.5px;
  color: rgba(255,255,255,0.6); font-weight: 600;
  margin-bottom: 6px; display: block;
}
.mines-input-control {
  display: flex; align-items: center; gap: 8px;
}
.mines-stepper {
  width: 28px; height: 28px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff; border-radius: 6px;
  font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
}
.mines-stepper:hover:not(:disabled) { background: rgba(0, 212, 255, 0.2); border-color: #00d4ff; }
.mines-stepper:disabled { opacity: 0.3; cursor: not-allowed; }
.mines-current-val {
  flex: 1; text-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; color: #fff;
  font-variant-numeric: tabular-nums;
}

.mines-action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-mines-start {
  padding: 16px;
  background: linear-gradient(135deg, #00d4ff, #00ff96);
  border: none; color: #000;
  border-radius: 12px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 3px; font-weight: 900;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
}
.btn-mines-start:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 30px rgba(0, 212, 255, 0.8);
}
.btn-mines-start:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-cashout {
  padding: 16px;
  background: linear-gradient(135deg, #ffd700, #ff6b00);
  border: none; color: #000;
  border-radius: 12px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 3px; font-weight: 900;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
  animation: cashoutPulse 1.5s ease-in-out infinite;
}
@keyframes cashoutPulse {
  0%,100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);}
  50% { box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);}
}
.btn-cashout:hover:not(:disabled) { transform: translateY(-2px); }
.btn-cashout:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }
.btn-cashout.full-width { grid-column: 1 / -1; }

.next-mult-preview {
  font-size: 11px; color: rgba(255,255,255,0.6);
  text-align: center; margin-top: 8px;
  font-variant-numeric: tabular-nums;
}
.next-mult-preview .next-val { color: #00ff96; font-weight: 700; }

/* Mines paytable shows next-pick multipliers */
.mines-paytable-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 10px; background: rgba(255,255,255,0.03);
  border-radius: 6px; font-size: 12px;
}
.mines-paytable-row.current {
  background: rgba(0, 255, 150, 0.1);
  border: 1px solid rgba(0, 255, 150, 0.3);
}
.mp-picks { color: rgba(255,255,255,0.7); }
.mp-mult { font-family: 'Bebas Neue', sans-serif; color: #ffd700; font-size: 14px; }
.mines-paytable-row.current .mp-mult { color: #00ff96; }

/* ===== HORSE RACING ===== */
.horses-section { display: flex; justify-content: center; }
.horses-machine {
  width: 100%; max-width: 560px;
  background: linear-gradient(180deg, #2e1a0d 0%, #200d08 100%);
  border: 2px solid rgba(255, 170, 0, 0.3);
  border-radius: 20px; padding: 22px;
  box-shadow: 0 0 40px rgba(255, 170, 0, 0.2), inset 0 0 40px rgba(0,0,0,0.5);
  position: relative;
}
.horses-machine::before {
  content: ''; position: absolute; inset: -2px;
  border-radius: 20px; padding: 2px;
  background: linear-gradient(135deg, #ffaa00, #ff6b00, #ffd700, #ffaa00);
  background-size: 300% 300%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: borderShift 4s linear infinite; pointer-events: none;
}

.race-track {
  background: linear-gradient(180deg, #87ceeb 0%, #b8e0f0 50%, #6b9b3e 50%, #4a7028 100%);
  border-radius: 12px;
  padding: 8px 0;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  border: 2px solid rgba(255, 170, 0, 0.3);
}
.race-track::before {
  content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 50%;
  background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 30px, transparent 30px 60px);
}
.horse-lane {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px;
  position: relative;
  height: 38px;
  border-bottom: 1px dashed rgba(0,0,0,0.15);
}
.horse-lane:last-child { border-bottom: none; }
.horse-name {
  font-size: 11px; font-weight: 700;
  width: 70px; flex-shrink: 0;
  color: #1a0d2e;
  text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  z-index: 2;
}
.horse-track-area {
  flex: 1; position: relative; height: 100%;
}
.horse-emoji {
  position: absolute;
  top: 50%; left: 0;
  transform: translateY(-50%);
  font-size: 28px;
  transition: left 0.1s linear;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  z-index: 3;
}
.horse-emoji.running { animation: horseBob 0.2s ease-in-out infinite; }
@keyframes horseBob { 0%,100% { transform: translateY(-50%) translateY(-2px);} 50% { transform: translateY(-50%) translateY(2px);} }
.horse-emoji.winner { animation: winnerCelebrate 0.5s ease-in-out infinite; }
@keyframes winnerCelebrate {
  0%,100% { transform: translateY(-50%) scale(1.4) rotate(-10deg);}
  50% { transform: translateY(-50%) scale(1.5) rotate(10deg);}
}
.finish-line {
  position: absolute; top: 0; bottom: 0; right: 4px; width: 6px;
  background: repeating-linear-gradient(0deg, #000 0 6px, #fff 6px 12px);
  z-index: 2;
  border-radius: 2px;
}

.horse-pick-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.horse-pick {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: rgba(0,0,0,0.3);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.horse-pick:hover { background: rgba(255, 170, 0, 0.15); border-color: rgba(255, 170, 0, 0.4); transform: translateX(4px); }
.horse-pick.selected {
  background: linear-gradient(90deg, rgba(255, 170, 0, 0.25), rgba(255, 100, 0, 0.15));
  border-color: #ffaa00;
  box-shadow: 0 0 20px rgba(255, 170, 0, 0.4);
}
.horse-pick.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
.horse-pick-emoji { font-size: 28px; }
.horse-pick-info { flex: 1; }
.horse-pick-name { font-weight: 700; font-size: 14px; }
.horse-pick-stats { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 2px; }
.horse-pick-odds {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; color: #ffd700;
  text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
}

.horse-result-display {
  text-align: center;
  padding: 12px; margin-bottom: 14px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255, 170, 0, 0.3);
  border-radius: 10px;
  min-height: 50px;
  display: flex; align-items: center; justify-content: center;
}
.horse-result-display.win {
  background: rgba(0, 200, 100, 0.15);
  border-color: rgba(0, 255, 150, 0.5);
}
.horse-result-display.lose {
  background: rgba(120, 30, 30, 0.15);
}
.horse-result-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; letter-spacing: 2px;
}
.horse-result-display.win .horse-result-text { color: #00ff96; text-shadow: 0 0 12px rgba(0, 255, 150, 0.6); }
.horse-result-display.lose .horse-result-text { color: rgba(255, 100, 100, 0.8); }

.btn-race-start {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #ffaa00, #ff6b00);
  border: none; color: #000;
  border-radius: 12px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px; letter-spacing: 3px; font-weight: 900;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
  margin-top: 10px;
}
.btn-race-start:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(255, 170, 0, 0.8); }
.btn-race-start:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== PLINKO ===== */
.plinko-section { display: flex; justify-content: center; }
.plinko-machine {
  width: 100%; max-width: 560px;
  background: linear-gradient(180deg, #1a0d2e 0%, #0d0820 100%);
  border: 2px solid rgba(255, 215, 0, 0.3);
  border-radius: 20px; padding: 22px;
  box-shadow: 0 0 40px rgba(255, 215, 0, 0.2), inset 0 0 40px rgba(0,0,0,0.5);
  position: relative;
}
.plinko-machine::before {
  content: ''; position: absolute; inset: -2px;
  border-radius: 20px; padding: 2px;
  background: linear-gradient(135deg, #ffd700, #ff00aa, #00d4ff, #ffd700);
  background-size: 300% 300%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: borderShift 4s linear infinite; pointer-events: none;
}

.plinko-board-wrap {
  background: #000;
  border-radius: 12px;
  border: 2px solid rgba(255, 215, 0, 0.4);
  padding: 12px;
  margin-bottom: 14px;
  position: relative;
}
#plinkoCanvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 8px;
  background: linear-gradient(180deg, #0a0518 0%, #1a0d2e 100%);
}

.plinko-slots {
  display: grid;
  gap: 3px;
  margin-top: 6px;
}
.plinko-slot {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  text-align: center;
  padding: 6px 2px;
  border-radius: 6px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.5px;
  transition: all 0.2s;
}
.plinko-slot.hit {
  animation: slotHit 0.6s ease;
  box-shadow: 0 0 20px currentColor;
}
@keyframes slotHit {
  0% { transform: scale(1);}
  30% { transform: scale(1.3);}
  100% { transform: scale(1);}
}

.plinko-risk-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.plinko-risk {
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 8px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}
.plinko-risk:hover { background: rgba(255, 215, 0, 0.15); }
.plinko-risk.active {
  border-color: #ffd700;
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 100, 0, 0.15));
  box-shadow: 0 0 16px rgba(255, 215, 0, 0.4);
}

.btn-plinko-drop {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #ffd700, #ff6b00);
  border: none; color: #000;
  border-radius: 12px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px; letter-spacing: 3px; font-weight: 900;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
}
.btn-plinko-drop:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(255, 215, 0, 0.8); }
.btn-plinko-drop:disabled { opacity: 0.4; cursor: not-allowed; }

.plinko-drops-count {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  margin-bottom: 10px;
}
.drop-count-btn {
  padding: 8px 4px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.drop-count-btn.active {
  background: rgba(255, 215, 0, 0.2);
  border-color: #ffd700;
}

/* ===== USER BAR ===== */
.user-tab {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 10px 18px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; cursor: pointer; transition: all 0.2s;
}
.user-tab:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
.user-tab.active {
  background: linear-gradient(135deg, rgba(255, 0, 170, 0.2), rgba(0, 212, 255, 0.2));
  border-color: #ff00aa;
  box-shadow: 0 0 24px rgba(255, 0, 170, 0.4);
}
.user-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.user-info { display: flex; flex-direction: column; }
.user-name { font-size: 13px; font-weight: 600; }
.user-bal { font-size: 11px; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; }

/* ===== MAIN ===== */
.main-content {
  position: relative; z-index: 5;
  display: grid; grid-template-columns: 240px 1fr 240px; gap: 20px;
  padding: 12px 28px 40px; max-width: 1400px; margin: 0 auto;
}
.side-panel { display: flex; flex-direction: column; gap: 10px; }
.panel-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px;
  color: rgba(255,255,255,0.7); padding-bottom: 8px;
  border-bottom: 1px solid rgba(255, 0, 170, 0.3);
}
.mt-large { margin-top: 18px; }

/* Stat cards */
.stat-card {
  padding: 12px 14px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
  transition: all 0.3s;
}
.stat-card.highlight {
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 170, 0, 0.05));
  border-color: rgba(255, 215, 0, 0.3);
}
.stat-card.pulse { animation: statPulse 0.6s ease; }
@keyframes statPulse { 50% { transform: scale(1.05); border-color: #ffd700; } }
.stat-label { font-size: 10px; letter-spacing: 1.5px; color: rgba(255,255,255,0.5); font-weight: 600; margin-bottom: 2px; }
.stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; color: #fff; font-variant-numeric: tabular-nums; }
.stat-card.highlight .stat-value { color: #ffd700; }

/* Combo meter */
.combo-card {
  background: linear-gradient(135deg, rgba(255, 100, 0, 0.15), rgba(255, 0, 170, 0.15));
  border: 1px solid rgba(255, 100, 0, 0.4);
  border-radius: 10px; padding: 12px 14px;
}
.combo-label { font-size: 10px; letter-spacing: 1.5px; color: rgba(255,200,100,0.9); font-weight: 600; }
.combo-value { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #ffaa00; text-shadow: 0 0 12px rgba(255,170,0,0.6); }
.combo-bar { height: 4px; background: rgba(0,0,0,0.3); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.combo-fill { height: 100%; background: linear-gradient(90deg, #ff6b00, #ffaa00, #ffd700); transition: width 0.3s; border-radius: 2px; }

/* Leaderboard */
.leaderboard { display: flex; flex-direction: column; gap: 6px; }
.lb-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; background: rgba(255,255,255,0.03);
  border-radius: 8px; font-size: 13px; transition: all 0.2s;
}
.lb-row.you { background: rgba(255, 0, 170, 0.15); border: 1px solid rgba(255, 0, 170, 0.4); }
.lb-rank { font-family: 'Bebas Neue', sans-serif; width: 22px; text-align: center; font-size: 18px; }
.lb-rank.gold { color: #ffd700; text-shadow: 0 0 8px rgba(255,215,0,0.6); }
.lb-rank.silver { color: #c0c0c0; }
.lb-rank.bronze { color: #cd7f32; }
.lb-name { flex: 1; font-weight: 600; }
.lb-bal { font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.7); font-size: 12px; }

/* ===== SLOT MACHINE ===== */
.slot-section { display: flex; justify-content: center; }
.machine {
  width: 100%; max-width: 560px;
  background: linear-gradient(180deg, #1a0d2e 0%, #0d0820 100%);
  border: 2px solid rgba(255, 0, 170, 0.3);
  border-radius: 20px; padding: 22px;
  box-shadow: 0 0 40px rgba(255, 0, 170, 0.2), inset 0 0 40px rgba(0,0,0,0.5);
  position: relative;
}
.machine::before {
  content: ''; position: absolute; inset: -2px;
  border-radius: 20px; padding: 2px;
  background: linear-gradient(135deg, #ff00aa, #ffaa00, #00d4ff, #ff00aa);
  background-size: 300% 300%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: borderShift 4s linear infinite; pointer-events: none;
}
@keyframes borderShift { 0% { background-position: 0% 50%;} 100% { background-position: 300% 50%;} }

.machine-header { text-align: center; margin-bottom: 14px; }
.jackpot-display {
  display: inline-flex; flex-direction: column;
  padding: 8px 32px;
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 100, 0, 0.2));
  border: 1px solid rgba(255, 215, 0, 0.5);
  border-radius: 12px; position: relative; overflow: hidden;
}
.jackpot-display::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  animation: jpShine 3s linear infinite;
}
@keyframes jpShine { 0% { transform: translateX(-100%);} 100% { transform: translateX(100%);} }
.jackpot-label { font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 3px; color: #ffd700; animation: jackpotPulse 2s ease-in-out infinite; }
@keyframes jackpotPulse { 0%,100% { opacity: 0.7;} 50% { opacity: 1;} }
.jackpot-amount { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #ffd700; text-shadow: 0 0 16px rgba(255, 215, 0, 0.8); letter-spacing: 1px; font-variant-numeric: tabular-nums; }

.reels-container { margin-bottom: 14px; }
.reel-frame {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  padding: 12px; background: #000;
  border-radius: 12px; border: 2px solid rgba(255, 215, 0, 0.4);
  position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
}
.reel-frame.charging { animation: chargingPulse 0.4s ease-in-out infinite; }
@keyframes chargingPulse {
  0%,100% { border-color: rgba(255, 215, 0, 0.4); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
  50% { border-color: #ff00aa; box-shadow: inset 0 0 30px rgba(255, 0, 170, 0.3), 0 0 30px rgba(255, 0, 170, 0.5); }
}
.reel {
  height: 140px;
  background: linear-gradient(180deg, #0a0518 0%, #1a0d2e 50%, #0a0518 100%);
  border-radius: 8px; overflow: hidden; position: relative;
  border: 1px solid rgba(255,255,255,0.1);
}
.reel::before, .reel::after {
  content: ''; position: absolute; left: 0; right: 0; height: 30px; z-index: 2; pointer-events: none;
}
.reel::before { top: 0; background: linear-gradient(180deg, rgba(0,0,0,0.9), transparent); }
.reel::after { bottom: 0; background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent); }
.reel-strip { display: flex; flex-direction: column; align-items: center; will-change: transform; }
.reel-symbol { height: 140px; display: flex; align-items: center; justify-content: center; font-size: 72px; flex-shrink: 0; }
.reel.winning { animation: winFlash 0.4s ease-in-out 4; }
.reel.near-miss { animation: nearMiss 0.5s ease-in-out 2; }
@keyframes winFlash {
  0%,100% { box-shadow: 0 0 0 rgba(255, 215, 0, 0); }
  50% { box-shadow: 0 0 40px rgba(255, 215, 0, 1), inset 0 0 30px rgba(255, 215, 0, 0.7); }
}
@keyframes nearMiss {
  0%,100% { box-shadow: 0 0 0 rgba(255, 100, 100, 0); }
  50% { box-shadow: 0 0 30px rgba(255, 100, 100, 0.7), inset 0 0 20px rgba(255, 100, 100, 0.3); }
}
.reel.land-bump .reel-strip { animation: landBump 0.2s ease-out; }
@keyframes landBump { 0% { transform: translateY(var(--ty));} 50% { transform: translateY(calc(var(--ty) + 15px));} 100% { transform: translateY(var(--ty));} }

.payline {
  position: absolute; left: 12px; right: 12px; top: 50%; height: 2px;
  background: linear-gradient(90deg, transparent, #ff00aa, #ffaa00, #ff00aa, transparent);
  transform: translateY(-50%); opacity: 0.6; pointer-events: none;
  animation: paylineShimmer 2s linear infinite;
}
@keyframes paylineShimmer { 0% { opacity: 0.4;} 50% { opacity: 0.9;} 100% { opacity: 0.4;} }

.message-bar {
  text-align: center; padding: 12px; margin-bottom: 14px;
  background: rgba(0,0,0,0.4); border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  min-height: 48px; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s;
}
.message-text { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: rgba(255,255,255,0.8); }
.message-bar.win { background: rgba(0, 200, 100, 0.15); border-color: rgba(0, 255, 150, 0.5); }
.message-bar.win .message-text { color: #00ff96; text-shadow: 0 0 12px rgba(0, 255, 150, 0.6); animation: msgBounce 0.5s ease; }
.message-bar.lose { background: rgba(120, 30, 30, 0.15); }
.message-bar.lose .message-text { color: rgba(255, 100, 100, 0.8); }
.message-bar.jackpot {
  background: linear-gradient(90deg, rgba(255, 215, 0, 0.3), rgba(255, 0, 170, 0.3));
  border-color: #ffd700; animation: jpBarFlash 0.3s ease-in-out infinite;
}
@keyframes jpBarFlash { 0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.4);} 50% { box-shadow: 0 0 40px rgba(255,215,0,0.9);} }
.message-bar.jackpot .message-text {
  background: linear-gradient(90deg, #ffd700, #ff00aa, #ffd700); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  font-size: 26px; animation: textShimmer 1.5s linear infinite;
}
@keyframes textShimmer { 0% { background-position: 0% 50%;} 100% { background-position: 200% 50%;} }
@keyframes msgBounce { 0% { transform: scale(0.8);} 60% { transform: scale(1.15);} 100% { transform: scale(1);} }

/* Bet controls */
.bet-controls { margin-bottom: 14px; }
.bet-amount-display { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.bet-label { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; font-size: 14px; color: rgba(255,255,255,0.6); }
.bet-value { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #00d4ff; text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); font-variant-numeric: tabular-nums; }
.bet-slider { width: 100%; height: 8px; appearance: none; background: rgba(255,255,255,0.1); border-radius: 4px; outline: none; margin-bottom: 10px; }
.bet-slider::-webkit-slider-thumb {
  appearance: none; width: 22px; height: 22px;
  background: linear-gradient(135deg, #ff00aa, #ffaa00); border-radius: 50%; cursor: pointer;
  box-shadow: 0 0 12px rgba(255, 0, 170, 0.6);
}
.bet-slider::-moz-range-thumb { width: 22px; height: 22px; background: linear-gradient(135deg, #ff00aa, #ffaa00); border-radius: 50%; cursor: pointer; border: none; }
.quick-bets { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.quick-bet {
  padding: 8px 4px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1); color: #fff;
  border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.quick-bet:hover { background: rgba(0, 212, 255, 0.2); border-color: #00d4ff; transform: translateY(-2px); }
.quick-bet.active { background: rgba(0, 212, 255, 0.3); border-color: #00d4ff; box-shadow: 0 0 12px rgba(0, 212, 255, 0.4); }

.spin-controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; }
.btn-max, .btn-auto {
  padding: 16px; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.15); color: #fff;
  border-radius: 12px; font-family: 'Bebas Neue', sans-serif;
  font-size: 16px; letter-spacing: 2px; cursor: pointer; transition: all 0.2s;
}
.btn-max:hover { background: rgba(255, 215, 0, 0.2); border-color: #ffd700; transform: translateY(-2px); }
.btn-auto:hover { background: rgba(0, 212, 255, 0.2); border-color: #00d4ff; transform: translateY(-2px); }
.btn-auto.active { background: rgba(0, 212, 255, 0.3); border-color: #00d4ff; animation: autoActive 1s ease-in-out infinite; }
@keyframes autoActive { 0%,100% { box-shadow: 0 0 10px rgba(0,212,255,0.4);} 50% { box-shadow: 0 0 25px rgba(0,212,255,0.8);} }
.btn-spin {
  padding: 16px;
  background: linear-gradient(135deg, #ff00aa, #ff6b00);
  border: none; color: #fff; border-radius: 12px;
  font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 4px;
  cursor: pointer; position: relative; overflow: hidden; transition: all 0.2s;
  box-shadow: 0 0 20px rgba(255, 0, 170, 0.5);
}
.btn-spin::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transform: translateX(-100%);
}
.btn-spin:hover:not(:disabled)::after { animation: btnShine 0.6s ease; }
@keyframes btnShine { to { transform: translateX(100%); } }
.btn-spin:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(255, 0, 170, 0.8); }
.btn-spin:active:not(:disabled) { transform: translateY(0); }
.btn-spin:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-spin.spinning .spin-text { animation: spinTextPulse 0.5s ease-in-out infinite; }
@keyframes spinTextPulse { 0%,100% { opacity: 0.6;} 50% { opacity: 1;} }

/* Paytable */
.paytable { display: flex; flex-direction: column; gap: 4px; }
.paytable-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px; background: rgba(255,255,255,0.03);
  border-radius: 6px; font-size: 13px; transition: all 0.2s;
}
.paytable-row:hover { background: rgba(255,255,255,0.06); transform: translateX(2px); }
.paytable-symbols { font-size: 18px; letter-spacing: 2px; }
.paytable-mult { font-family: 'Bebas Neue', sans-serif; color: #ffd700; font-size: 16px; }
.paytable-row.jackpot {
  background: linear-gradient(90deg, rgba(255, 215, 0, 0.15), rgba(255, 100, 0, 0.1));
  border: 1px solid rgba(255, 215, 0, 0.4);
  animation: jpRowPulse 3s ease-in-out infinite;
}
@keyframes jpRowPulse { 0%,100% { box-shadow: 0 0 0 rgba(255,215,0,0);} 50% { box-shadow: 0 0 16px rgba(255,215,0,0.4);} }

/* Recent spins */
.recent-spins { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
.recent-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 10px; background: rgba(255,255,255,0.03);
  border-radius: 6px; font-size: 12px;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(-10px);} to { opacity: 1; transform: translateX(0);} }
.recent-row.win { background: rgba(0, 200, 100, 0.08); }
.recent-row.big-win { background: rgba(255, 215, 0, 0.15); border: 1px solid rgba(255, 215, 0, 0.3); }
.recent-symbols { font-size: 14px; }
.recent-amount { font-variant-numeric: tabular-nums; font-weight: 600; }
.recent-amount.win { color: #00ff96; }
.recent-amount.lose { color: rgba(255, 100, 100, 0.7); }

/* ===== WIN OVERLAY ===== */
.win-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  display: none; align-items: center; justify-content: center;
  z-index: 100; pointer-events: none;
}
.win-overlay.show { display: flex; animation: overlayFade 0.3s ease; }
@keyframes overlayFade { from { opacity: 0;} to { opacity: 1;} }
.win-content { text-align: center; animation: winPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes winPop {
  0% { transform: scale(0) rotate(-180deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
.win-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 96px; letter-spacing: 6px;
  background: linear-gradient(135deg, #ffd700, #ff00aa, #00d4ff);
  background-size: 200% 200%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: titleShimmer 2s linear infinite;
  text-shadow: 0 0 60px rgba(255, 215, 0, 0.4);
}
@keyframes titleShimmer { 0% { background-position: 0% 50%;} 100% { background-position: 200% 50%;} }
.win-amount { font-family: 'Bebas Neue', sans-serif; font-size: 72px; color: #ffd700; text-shadow: 0 0 30px rgba(255, 215, 0, 0.8); margin-top: 12px; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
.win-multiplier { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #00d4ff; letter-spacing: 4px; margin-top: 12px; text-shadow: 0 0 16px rgba(0, 212, 255, 0.6); }
.win-subtitle { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 16px; letter-spacing: 2px; }

/* Floating coin animation */
@keyframes coinFloat {
  0% { opacity: 0; transform: translateY(0) scale(0); }
  20% { opacity: 1; transform: translateY(-30px) scale(1); }
  100% { opacity: 0; transform: translateY(-120px) scale(0.5); }
}

/* ===== ADMIN PANEL ===== */
.admin-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
  z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.admin-backdrop.show { opacity: 1; pointer-events: all; }
.admin-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 480px; max-width: 100%;
  background: linear-gradient(180deg, #0d0820, #08060f);
  border-left: 2px solid rgba(255, 0, 170, 0.4);
  z-index: 201; transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column;
  box-shadow: -20px 0 60px rgba(0,0,0,0.5);
}
.admin-panel.show { transform: translateX(0); }
.admin-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 24px; border-bottom: 1px solid rgba(255, 0, 170, 0.3);
}
